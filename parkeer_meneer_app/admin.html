<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parkeer Meneer · Beheer</title><style>body{margin:0;background:#f2f7f6;color:#183b3a;font:16px system-ui}header{background:white;border-bottom:1px solid #ddd;padding:20px max(20px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1000px;margin:36px auto;padding:0 20px}.panel{background:white;padding:24px;border-radius:18px;box-shadow:0 6px 24px #1231;overflow-x:auto}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{text-align:left;padding:14px;border-bottom:1px solid #e2e9e7}th{background:#eff7f5}a{color:#137668}button{border:0;background:#147667;color:white;padding:11px 18px;border-radius:10px;cursor:pointer}</style></head><body><header><strong>🚗 Parkeer Meneer · Beheer</strong><a href="/">Terug naar parkeerapp</a></header><main><h1>Geregistreerde gebruikers</h1><p>Alleen toegankelijk voor de beheerder. Wachtwoorden worden niet weergegeven.</p><div class="panel"><button id="reload">Vernieuwen</button><p id="status">Gegevens laden…</p><table><thead><tr><th>ID</th><th>Naam</th><th>E-mailadres</th><th>Geregistreerd (UTC)</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>async function load(){const status=document.getElementById('status'),rows=document.getElementById('rows');status.textContent='Gegevens laden…';rows.replaceChildren();try{const r=await fetch('/api/admin/users',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error(r.status===403?'Geen beheerderstoegang':'Ophalen mislukt');const data=await r.json();status.textContent=data.count+' geregistreerde gebruiker(s)';for(const user of data.users){const tr=document.createElement('tr');for(const value of [user.id,user.name||'—',user.email,user.created_at]){const td=document.createElement('td');td.textContent=value;tr.append(td)}rows.append(tr)}}catch(e){status.textContent=e.message}}document.getElementById('reload').onclick=load;load();</script></body></html>
