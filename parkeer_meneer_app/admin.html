<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parkeer Meneer · Beheer</title><style>body{margin:0;background:#f2f7f6;color:#183b3a;font:16px system-ui}header{background:white;border-bottom:1px solid #ddd;padding:20px max(20px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1000px;margin:36px auto;padding:0 20px}.panel{background:white;padding:24px;border-radius:18px;box-shadow:0 6px 24px #1231;overflow-x:auto}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{text-align:left;padding:14px;border-bottom:1px solid #e2e9e7}th{background:#eff7f5}a{color:#137668}button{border:0;background:#147667;color:white;padding:11px 18px;border-radius:10px;cursor:pointer}dialog{border:0;border-radius:18px;padding:26px;width:min(420px,calc(100% - 36px));box-shadow:0 20px 60px #1235}dialog::backdrop{background:#1238}dialog form{display:grid;gap:12px}dialog label{display:grid;gap:5px}dialog input{padding:11px;border:1px solid #b7c7c4;border-radius:8px}dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:8px 0 0}button.secondary{background:#e5efed;color:#183b3a}button.danger{background:#b72e38}td.actions{white-space:nowrap}td.actions button{margin:2px;padding:8px 10px}</style></head><body><header><strong>🚗 Parkeer Meneer · Beheer</strong><a href="/">Terug naar parkeerapp</a></header><main><h1>Geregistreerde gebruikers</h1><p>Alleen toegankelijk voor de beheerder. Wachtwoorden worden niet weergegeven.</p><div class="panel"><button id="reload">Vernieuwen</button><p id="status">Gegevens laden…</p><table><thead><tr><th>ID</th><th>Naam</th><th>E-mailadres</th><th>Geregistreerd (UTC)</th><th>Acties</th></tr></thead><tbody id="rows"></tbody></table></div></main><dialog id="editor"><form id="editForm"><h2>Gebruiker wijzigen</h2><label>Naam<input id="editName" maxlength="80"></label><label>E-mailadres<input id="editEmail" type="email" maxlength="255" required></label><p id="editStatus" role="status"></p><menu><button type="button" class="secondary" id="cancelEdit">Annuleren</button><button type="submit">Opslaan</button></menu></form></dialog><script>async function load(){const status=document.getElementById('status'),rows=document.getElementById('rows');status.textContent='Gegevens laden…';rows.replaceChildren();try{const r=await fetch('/api/admin/users',{credentials:'same-origin',cache:'no-store'});if(!r.ok)throw Error(r.status===403?'Geen beheerderstoegang':'Ophalen mislukt');const data=await r.json();status.textContent=data.count+' geregistreerde gebruiker(s)';for(const user of data.users){const tr=document.createElement('tr');for(const value of [user.id,user.name||'—',user.email,user.created_at]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const actions=document.createElement('td');actions.className='actions';const edit=document.createElement('button');edit.textContent='Wijzigen';edit.onclick=()=>openEdit(user);const del=document.createElement('button');del.textContent='Verwijderen';del.className='danger';del.onclick=()=>removeUser(user);actions.append(edit,del);tr.append(actions);rows.append(tr)}}catch(e){status.textContent=e.message}}let editing=null;const editor=document.getElementById('editor');function openEdit(user){editing=user;document.getElementById('editName').value=user.name||'';document.getElementById('editEmail').value=user.email;document.getElementById('editStatus').textContent='';editor.showModal()}document.getElementById('cancelEdit').onclick=()=>editor.close();document.getElementById('editForm').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('editStatus');status.textContent='Opslaan…';try{const r=await fetch('/api/admin/users/'+editing.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('editName').value,email:document.getElementById('editEmail').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Opslaan mislukt');editor.close();await load()}catch(err){status.textContent=err.message}};async function removeUser(user){if(!confirm('Account van '+user.email+' definitief verwijderen? Dit kan niet ongedaan worden gemaakt.'))return;try{const r=await fetch('/api/admin/users/'+user.id,{method:'DELETE'});const d=await r.json();if(!r.ok)throw Error(d.error||'Verwijderen mislukt');await load()}catch(err){alert(err.message)}}document.getElementById('reload').onclick=load;load();</script></body></html>
