name: Cityverse MVP - offline controles
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile parkeer_meneer_app/app.py
      - name: Check frontend simulation, forecast and MVP labels
        run: node parkeer_meneer_app/tests/simulation.test.cjs
